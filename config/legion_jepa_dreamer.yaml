system:
  seed: 42
  device: "cuda"
  checkpoint_dir: "./checkpoints/legion_jepa_dreamer"
  log_interval: 1000
  eval_interval: 1000
  eval_episodes: 5
  total_steps: 300000 #150000 baseline
  checkpoint_interval: 10000
  resume: true

encoder_warmup_steps: 2000

legion:
  knowledge_space:
    max_components: 30
    expansion_threshold: 0.3
    forgetting_factor: 0.0
  task_vector_type: "one_hot"
  replay_buffer:
    pixel_capacity: 50000
    state_capacity: 500000
    max_size: 100000

lewm_encoder:
  input_resolution: [3, 224, 224]
  embed_dim: 512
  sigreg_regularized: true
  pretrained_weights: "weights/lewm_kuka_shared_base.pt"
  freeze_weights: true
  encoder_type: "lewm" #lewm or mudreamer or random

mudreamer_core:
  horizon: 15
  batch_size: 16          # reduced from 64 — sequence batches are more expensive
  sequence_length: 50     # steps per training sequence
  max_episodes: 500       # episode storage capacity
  min_episodes_before_train: 10   # wait for 10 complete episodes before training
  action_mean_penalty: 0.0001   # tried 1e-3, 0.00003, best candidate 0.0001
  discount: 0.99
  lambda_: 0.95
  kl_weight: 1.0
  rssm:
    deter_dim: 256
    stoch_dim: 16
    stoch_classes: 16
  networks:
    hidden_dim: 256
    activation: "elu"
  optimizer:
    lr_actor: 0.00003
    lr_critic: 0.0001
    lr_predictor: 0.0001

btn:
  enabled: true
  n_subjects: 30
  n_predicates: 15
  n_objects: 30
  vocab_embed_dim: 64
  conditioning_dim: 128
  lr: 0.0003

environment:
  suite: "metaworld"
  tasks:
    - reach-v3
    - push-v3
    - pick-place-v3
    - door-open-v3
  render_mode: "rgb_array"
  action_dim: 4
  reward_mapping:
    normalize_rewards: true
    clip_range: [-10.0, 10.0]