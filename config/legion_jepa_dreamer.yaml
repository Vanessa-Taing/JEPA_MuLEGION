system:
  seed: 42
  device: "cuda"
  checkpoint_dir: "./checkpoints/legion_jepa_dreamer"
  log_interval: 1000
  eval_interval: 1000
  eval_episodes: 5
  total_steps: 50000

# Encoder warmup: freeze encoder gradient updates for this many steps
# even in mudreamer mode — gives predictor/critic time to stabilize
# before their input distribution starts shifting. Irrelevant for
# lewm and random conditions (encoder is always frozen there).
encoder_warmup_steps: 2000

legion:
  knowledge_space:
    max_components: 30
    expansion_threshold: 0.3
    forgetting_factor: 0.0
  task_vector_type: "one_hot"
  replay_buffer:
    pixel_capacity: 50000
    state_capacity: 500000
    max_size: 100000

lewm_encoder:
  input_resolution: [3, 224, 224]
  embed_dim: 512
  sigreg_regularized: true
  pretrained_weights: "weights/lewm_kuka_shared_base.pt"
  freeze_weights: true
  # "lewm"      -> pretrained JEPA + SIGReg, frozen
  # "mudreamer"  -> plain CNN + BatchNorm, trains jointly with world model
  # "random"    -> frozen random CNN (lower bound)
  encoder_type: "lewm"

mudreamer_core:
  horizon: 15
  batch_size: 64
  discount: 0.99
  lambda_: 0.95
  networks:
    hidden_dim: 256
    activation: "elu"
  optimizer:
    lr_actor: 0.00003
    lr_critic: 0.0001
    lr_predictor: 0.0001

# BTN: set enabled: false to run without BTN (ablation condition)
btn:
  enabled: false
  n_subjects: 30
  n_predicates: 15
  n_objects: 30
  vocab_embed_dim: 64
  conditioning_dim: 128
  lr: 0.0003

environment:
  suite: "metaworld"
  tasks:
    - reach-v3
    - push-v3
    - pick-place-v3
    - door-open-v3
  render_mode: "rgb_array"
  action_dim: 4
  reward_mapping:
    normalize_rewards: true
    clip_range: [-10.0, 10.0]